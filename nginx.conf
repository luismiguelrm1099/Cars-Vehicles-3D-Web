server {
    listen 80;
    listen [::]:80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Gzip compression for JS/CSS bundles, 3D glTF models (.glb), and point clouds (.bin)
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/wasm
        application/octet-stream
        model/gltf-binary
        model/gltf+json
        image/svg+xml;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Coolify healthcheck endpoint
    location = /health {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # Optimized 3D .glb models (explicit glTF binary MIME + 30d browser cache)
    location ~* \.glb$ {
        types {}
        default_type model/gltf-binary;
        add_header Cache-Control "public, max-age=2592000" always;
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }

    # Hero 3D point-cloud binary buffer (.bin)
    location ~* \.bin$ {
        add_header Cache-Control "public, max-age=2592000" always;
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }

    # Content-hashed Vite JS/CSS bundles (immutable 1-year cache)
    location ^~ /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }

    # Vehicle editorial and side-profile preview PNGs
    location ^~ /previews/ {
        add_header Cache-Control "public, max-age=2592000" always;
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }

    # Brand logos and icons
    location ^~ /brand/ {
        add_header Cache-Control "public, max-age=2592000" always;
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }

    # Never cache index.html so new deploys appear immediately
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }

    # SPA fallback routing
    location / {
        try_files $uri $uri/ /index.html;
    }
}
